<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <script>
        // Theme: the choice made with the navbar switch (saved in this browser), otherwise
        // the device's light/dark setting. Runs before the page draws to avoid a flash.
        (function() {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            function saved() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
            function apply() {
                var theme = saved() || (mq.matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-bs-theme', theme);
            }
            apply();
            mq.addEventListener('change', apply);
            window.toggleTheme = function() {
                var next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                try { localStorage.setItem('theme', next); } catch (e) {}
                document.documentElement.setAttribute('data-bs-theme', next);
            };
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Classroom Experiments{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}?v=20261007c" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Classroom Experiments</a>
            <button type="button" class="btn btn-sm btn-outline-light" id="theme-toggle" onclick="toggleTheme()"
                    title="Switch between light and dark mode" aria-label="Switch between light and dark mode">
                <span class="theme-icon-dark">&#9790; Dark</span><span class="theme-icon-light">&#9728; Light</span>
            </button>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/password-toggle.js') }}?v=20261007"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
